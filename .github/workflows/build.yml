name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned glass renderer
        run: python3 scripts/verify-glass-reference.py

      - name: Build and test standalone module
        run: |
          chmod +x gradlew
          ./gradlew test :app:lintDebug :glass:lintDebug :glass-lab:lintDebug :app:assembleDebug :glass-lab:assembleDebug :glass-lab:assembleDebugAndroidTest --no-daemon

      - name: Upload standalone module APK
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-Desktop-Lyrics-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload glass comparison APKs
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-glass-lab
          path: |
            glass-lab/build/outputs/apk/debug/glass-lab-debug.apk
            glass-lab/build/outputs/apk/androidTest/debug/glass-lab-debug-androidTest.apk
          if-no-files-found: error
